<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트건강증진실 출석체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
  /* =============== 설정값은 아래 <script> 맨 위에 있습니다 =============== */
  :root {
    --bg: #f4f1ea;
    --ink: #1d2b24;
    --sub: #5c6b63;
    --green: #2f6b4f;
    --green-soft: #dcebe2;
    --amber: #b5651d;
    --amber-soft: #f6e5d3;
    --red: #a33b2f;
    --line: #d6d0c4;
    --card: #fffdf8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 18px 28px 10px;
    border-bottom: 2px solid var(--ink);
  }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
  #clock { font-size: 1.15rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  nav { display: flex; gap: 8px; padding: 12px 28px 0; }
  nav button {
    font: inherit; font-size: 1.05rem; font-weight: 600;
    padding: 10px 22px; border: 2px solid var(--ink); border-radius: 999px;
    background: transparent; color: var(--ink); cursor: pointer;
  }
  nav button.on { background: var(--ink); color: var(--bg); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr);
    gap: 24px;
    padding: 20px 28px 28px;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .stage {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: #111;
    aspect-ratio: 4 / 3;
    align-self: start;
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  #preview, #overlay {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
  }
  .btn.huge { width: 100%; font-size: 1.6rem; padding: 22px; border-radius: 16px; }
  .guide {
    position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 3 / 4;
    transform: translate(-50%, -52%);
    border: 3px dashed rgba(255,255,255,0.55); border-radius: 50%;
    pointer-events: none;
  }
  .panel { display: flex; flex-direction: column; gap: 16px; }
  .message {
    background: var(--card); border: 2px solid var(--line); border-radius: 20px;
    padding: 26px 24px; min-height: 190px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .message .big { font-size: 2.3rem; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; }
  .message .small { font-size: 1.1rem; color: var(--sub); margin-top: 8px; line-height: 1.5; }
  .message.ok { background: var(--green-soft); border-color: var(--green); }
  .message.ok .big { color: var(--green); }
  .message.warn { background: var(--amber-soft); border-color: var(--amber); }
  .message.warn .big { color: var(--amber); }
  .message.err .big { color: var(--red); }
  .box {
    background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 20px 22px;
  }
  .box h2 { margin: 0 0 12px; font-size: 1.1rem; font-weight: 600; }
  select, input[type=text], input[type=password] {
    width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px;
    border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
  }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .btn {
    font: inherit; font-size: 1.1rem; font-weight: 700; padding: 13px 20px;
    border: none; border-radius: 12px; background: var(--green); color: #fff; cursor: pointer;
    white-space: nowrap;
  }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
  label.check { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; font-size: 1rem; line-height: 1.45; }
  label.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
  .count { font-size: 1rem; color: var(--sub); }
  .hidden { display: none !important; }
  .pinwrap {
    position: fixed; inset: 0; background: rgba(29,43,36,0.55);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .pinbox { background: var(--card); border-radius: 20px; padding: 26px; width: min(90vw, 380px); }
  .pinbox h2 { margin: 0 0 14px; font-size: 1.3rem; }
  .pinbox .err { color: var(--red); min-height: 1.4em; margin: 8px 0 0; }
  .progress { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 12px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s; }
</style>
</head>
<body>

<header>
  <h1>스마트건강증진실 출석체크</h1>
  <div id="clock"></div>
</header>

<nav>
  <button id="tabAttend" class="on">출석</button>
  <button id="tabRegister">얼굴 등록 (관리자)</button>
</nav>

<main>
  <div class="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="preview"></canvas>
    <canvas id="overlay"></canvas>
    <div class="guide"></div>
  </div>

  <div class="panel">
    <div id="message" class="message">
      <div class="big">준비 중입니다</div>
      <div class="small">카메라와 얼굴 인식 기능을 불러오고 있습니다.</div>
    </div>

    <!-- 출석 모드 -->
    <button id="attendBtn" class="btn huge">출석하기</button>

    <div id="attendPanel" class="box">
      <h2>얼굴 인식이 안 될 때</h2>
      <select id="manualSelect"><option value="">이름을 선택하세요</option></select>
      <div class="row">
        <button id="manualBtn" class="btn">수동 출석</button>
        <button id="reloadBtn" class="btn ghost">새로고침</button>
      </div>
      <p class="count" id="todayCount"></p>
    </div>

    <!-- 등록 모드 -->
    <div id="registerPanel" class="box hidden">
      <h2>새 이용자 얼굴 등록</h2>
      <input type="text" id="regName" placeholder="이름">
      <select id="regExisting" style="margin-top:10px">
        <option value="">신규 등록</option>
      </select>
      <label class="check">
        <input type="checkbox" id="regConsent">
        <span>개인정보(생체인식정보) 수집·이용 동의서를 받았습니다.</span>
      </label>
      <div class="row">
        <button id="regBtn" class="btn">얼굴 등록 시작</button>
      </div>
      <div class="progress"><i id="regProgress"></i></div>
      <p class="count">카메라 정면을 보고 3초간 움직이지 마세요. 기존 이용자를 선택하면 얼굴 데이터만 다시 저장합니다.</p>
    </div>
  </div>
</main>

<div id="pinWrap" class="pinwrap hidden">
  <div class="pinbox">
    <h2>관리자 비밀번호</h2>
    <input type="password" id="pinInput" inputmode="numeric" placeholder="비밀번호">
    <p class="err" id="pinErr"></p>
    <div class="row">
      <button id="pinOk" class="btn">확인</button>
      <button id="pinCancel" class="btn ghost">취소</button>
    </div>
  </div>
</div>

<script>
/* ===================== 설정 ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyiHYb9cF6gTg9ejhXA20x8xijYemFY1AbDAyqyFEtsMeKRYy1FUwMEOk7AUke-1aFz/exec';
const ADMIN_PIN = '1234';                    // 등록 화면 비밀번호 (꼭 바꾸세요)
const MATCH_THRESHOLD = 0.45;                // 낮을수록 엄격 (0.4~0.55 권장)
const AUTO_MODE = false;                     // true: 카메라 앞에 서면 자동 출석 / false: 출석하기 버튼으로 인식
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
const WASM_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.7.0/dist/';
const BACKENDS = ['wasm', 'webgl', 'cpu'];   // 앞에서부터 시도 (태블릿은 wasm이 가장 안정적)
const APP_VERSION = '2026-10-29b';
/* ================================================ */

const video = document.getElementById('video');
const preview = document.getElementById('preview');
const overlay = document.getElementById('overlay');
const msgBox = document.getElementById('message');
const manualSelect = document.getElementById('manualSelect');
const regExisting = document.getElementById('regExisting');
const attendBtn = document.getElementById('attendBtn');

let mode = 'attend';
let users = [];
let matcher = null;
let attendedToday = new Set();
let ready = false;
let sending = false;
let registering = false;
let msgTimer = null;
let cooldownUntil = 0;
let lastLabel = null, sameCount = 0, unknownCount = 0;
let lastDetectMs = 0;
let missStreak = 0;
let prepStart = 0;
let prepText = '';

/* ---------- 화면 메시지 ---------- */
function showMessage(big, small, type, holdMs) {
  msgBox.className = 'message' + (type ? ' ' + type : '');
  msgBox.innerHTML = '<div class="big"></div><div class="small"></div>';
  msgBox.querySelector('.big').textContent = big;
  msgBox.querySelector('.small').textContent = small || '';
  clearTimeout(msgTimer);
  if (holdMs) msgTimer = setTimeout(idleMessage, holdMs);
}
function idleMessage() {
  if (!ready) { showPrep(); return; }
  if (mode === 'attend') {
    if (AUTO_MODE) showMessage('카메라를 바라봐 주세요', '얼굴이 인식되면 자동으로 출석됩니다.');
    else showMessage('출석하기 버튼을 눌러 주세요', '버튼을 누른 뒤 카메라 정면을 바라보면 출석됩니다.');
  } else {
    showMessage('얼굴 등록', '이름을 입력하고 동의 여부를 확인한 뒤 등록을 시작하세요.');
  }
}
function showPrep() {
  const sec = prepStart ? Math.round((performance.now() - prepStart) / 1000) : 0;
  showMessage('준비 중입니다', `${prepText} (${sec}초 경과 · 처리 방식 ${backendName()})`);
}
setInterval(() => { if (!ready && prepStart && msgBox.querySelector('.big') && msgBox.querySelector('.big').textContent === '준비 중입니다') showPrep(); }, 1000);

/* ---------- 시계 ---------- */
function tick() {
  const d = new Date();
  const w = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  document.getElementById('clock').textContent =
    `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.(${w}) ` +
    `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
setInterval(tick, 1000); tick();

/* ---------- 처리 방식(백엔드) ---------- */
function backendName() {
  try { return faceapi.tf.getBackend() || '-'; } catch (e) { return '-'; }
}
async function useBackend(name) {
  try {
    if (name === 'wasm') faceapi.tf.setWasmPaths(WASM_URL);
  } catch (e) { /* 이미 설정됨 */ }
  try {
    const ok = await faceapi.tf.setBackend(name);
    if (!ok) return false;
    await faceapi.tf.ready();
    return faceapi.tf.getBackend() === name;
  } catch (e) {
    console.warn('백엔드 실패', name, e);
    return false;
  }
}
async function nextBackend() {
  const cur = backendName();
  const idx = BACKENDS.indexOf(cur);
  for (let i = idx + 1; i < BACKENDS.length; i++) {
    if (await useBackend(BACKENDS[i])) return true;
  }
  return false;
}

/* ---------- 얼굴 인식 1회 ---------- */
const snap = document.createElement('canvas');
function grabFrame() {
  const w = video.videoWidth || 640, h = video.videoHeight || 480;
  snap.width = w; snap.height = h;
  snap.getContext('2d').drawImage(video, 0, 0, w, h);
  return snap;
}
let busy = false;
function detectOnce(timeoutMs, size) {
  if (busy) return Promise.reject(new Error('이전 인식이 아직 끝나지 않았습니다'));
  busy = true;
  const t0 = performance.now();
  const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: size || 320, scoreThreshold: 0.3 });
  return new Promise((resolve, reject) => {
    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      reject(new Error('인식 시간 초과(' + Math.round(timeoutMs / 1000) + '초)'));
      // 멈춘 작업은 버리고 다음 인식을 허용
      busy = false;
    }, timeoutMs);
    faceapi.detectSingleFace(grabFrame(), opts).withFaceLandmarks(true).withFaceDescriptor()
      .then(r => {
        if (done) return;
        done = true; clearTimeout(timer); busy = false;
        lastDetectMs = performance.now() - t0;
        missStreak = r ? 0 : missStreak + 1;
        resolve(r);
      }, e => {
        if (done) return;
        done = true; clearTimeout(timer); busy = false;
        reject(e);
      });
  });
}

/* webgl에서 얼굴을 계속 못 찾으면 다음 처리 방식으로 전환 */
async function maybeSwitchBackend() {
  if (missStreak < 4 || backendName() !== 'webgl') return false;
  showMessage('호환 모드로 전환합니다', '잠시 기다려 주세요.', 'warn');
  missStreak = 0;
  return nextBackend();
}

/* ---------- 서버 통신 ---------- */
async function apiGet(params) {
  const res = await fetch(API_URL + '?' + new URLSearchParams(params));
  return res.json();
}
async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return res.json();
}

async function loadUsers() {
  const data = await apiGet({ action: 'users' });
  if (!data.ok) throw new Error(data.message);
  users = data.users || [];
  attendedToday = new Set(data.attendedToday || []);
  const labeled = users
    .filter(u => Array.isArray(u.descriptor))
    .map(u => new faceapi.LabeledFaceDescriptors(u.id, [new Float32Array(u.descriptor)]));
  matcher = labeled.length ? new faceapi.FaceMatcher(labeled, MATCH_THRESHOLD) : null;
  const opts = users.map(u => `<option value="${u.id}">${u.name} (${u.id})</option>`).join('');
  manualSelect.innerHTML = '<option value="">이름을 선택하세요</option>' + opts;
  regExisting.innerHTML = '<option value="">신규 등록</option>' + opts;
  updateCount();
}
function updateCount() {
  const faceCount = users.filter(u => Array.isArray(u.descriptor)).length;
  document.getElementById('todayCount').textContent =
    `등록 이용자 ${users.length}명 (얼굴 등록 ${faceCount}명) · 오늘 출석 ${attendedToday.size}명 · ` +
    `처리 방식 ${backendName()} · 1회 ${(lastDetectMs / 1000).toFixed(1)}초 · 버전 ${APP_VERSION}`;
}

/* ---------- 출석 처리 ---------- */
async function attend(id, method, score) {
  const user = users.find(u => u.id === id);
  if (!user) return;
  sending = true;
  try {
    const r = await apiPost({ action: 'attend', id, method, score });
    if (!r.ok) { showMessage('출석 실패', r.message, 'err', 5000); return; }
    attendedToday.add(id);
    updateCount();
    if (r.duplicate && r.reason === 'gap') {
      showMessage(`${r.name}님`, `방금 출석하셨습니다. 다음 출석은 ${r.waitMin}분 뒤에 가능합니다.`, 'warn', 5000);
    } else if (r.duplicate) {
      showMessage(`${r.name}님`, `오늘은 이미 ${r.maxPerDay || 2}번 출석하셨습니다. ${r.month}월 ${r.monthCount}번째 방문까지 기록되어 있습니다.`, 'warn', 5000);
    } else {
      const todayText = r.todayCount > 1 ? ` 오늘 ${r.todayCount}번째 출석입니다.` : '';
      showMessage(`${r.name}님, 반갑습니다`, `${r.month}월 ${r.monthCount}번째 방문입니다.${todayText} (${r.time})`, 'ok', 6000);
    }
  } catch (e) {
    showMessage('연결 오류', '인터넷 연결 또는 웹앱 주소를 확인하세요.', 'err', 5000);
  } finally {
    sending = false;
    cooldownUntil = Date.now() + 5000;
  }
}

/* ---------- 카메라 미리보기 ---------- */
function drawPreview() {
  const w = video.videoWidth, h = video.videoHeight;
  if (w) {
    if (preview.width !== w) { preview.width = w; preview.height = h; }
    preview.getContext('2d').drawImage(video, 0, 0, w, h);
  }
  requestAnimationFrame(drawPreview);
}
function drawBox(result) {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w) return;
  overlay.width = w; overlay.height = h;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  if (!result) return;
  const b = result.detection.box;
  ctx.lineWidth = Math.max(3, w / 160);
  ctx.strokeStyle = '#7fd1a5';
  ctx.strokeRect(b.x, b.y, b.width, b.height);
}
function resumeCamera() {
  if (video.srcObject && video.paused) video.play().catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeCamera(); });
window.addEventListener('focus', resumeCamera);
setInterval(resumeCamera, 2000);

/* ---------- 버튼 출석 ---------- */
async function attendByButton() {
  if (!ready) { showPrep(); return; }
  if (sending || registering) return;
  if (!matcher) { showMessage('등록된 얼굴이 없습니다', '얼굴 등록 화면에서 이용자를 먼저 등록하세요.', 'warn', 4000); return; }
  attendBtn.disabled = true;
  try {
    let found = null, faces = 0;
    for (let i = 1; i <= 5 && !found; i++) {
      showMessage('카메라를 바라봐 주세요', `인식 중입니다 (${i}/5) · ${backendName()}`);
      const r = await detectOnce(60000, 416);
      drawBox(r);
      if (!r) { if (await maybeSwitchBackend()) i = 0; continue; }
      faces++;
      const best = matcher.findBestMatch(r.descriptor);
      if (best.label !== 'unknown') found = best;
      else if (faces >= 2) break;
    }
    if (found) await attend(found.label, '얼굴인식', Math.round((1 - found.distance) * 100) / 100);
    else if (faces) showMessage('등록되지 않은 얼굴입니다', '담당자에게 등록을 요청하거나 수동 출석을 이용하세요.', 'warn', 5000);
    else showMessage('얼굴이 보이지 않습니다', '카메라 정면에서 다시 출석하기를 눌러 주세요.', 'warn', 5000);
  } catch (e) {
    showMessage('인식 중 오류', '오류 내용: ' + (e && e.message ? e.message : e), 'err', 6000);
  } finally {
    setTimeout(() => drawBox(null), 1500);
    attendBtn.disabled = false;
    updateCount();
  }
}

/* ---------- 자동 인식 루프 (AUTO_MODE = true 일 때만) ---------- */
async function loop() {
  try {
    if (mode === 'attend' && !sending && !registering && !busy && Date.now() > cooldownUntil) {
      const r = await detectOnce(60000, 320);
      drawBox(r);
      if (r && matcher) {
        const best = matcher.findBestMatch(r.descriptor);
        if (best.label !== 'unknown') {
          unknownCount = 0;
          sameCount = (best.label === lastLabel) ? sameCount + 1 : 1;
          lastLabel = best.label;
          if (sameCount >= 2) {
            sameCount = 0; lastLabel = null;
            await attend(best.label, '얼굴인식', Math.round((1 - best.distance) * 100) / 100);
          }
        } else if (++unknownCount >= 5) {
          unknownCount = 0;
          showMessage('등록되지 않은 얼굴입니다', '담당자에게 등록을 요청하거나 수동 출석을 이용하세요.', 'warn', 4000);
          cooldownUntil = Date.now() + 3000;
        }
      }
    }
  } catch (e) { console.error(e); }
  setTimeout(loop, 500);
}

/* ---------- 얼굴 등록 ---------- */
async function registerFace() {
  if (!ready) { showPrep(); return; }
  const existingId = regExisting.value;
  const name = document.getElementById('regName').value.trim();
  const consent = document.getElementById('regConsent').checked;
  if (!existingId && !name) { showMessage('이름을 입력하세요', '', 'err', 3000); return; }
  if (!consent) { showMessage('동의 확인이 필요합니다', '동의서를 받은 뒤 체크하세요.', 'err', 3000); return; }
  if (!existingId) {
    const key = name.replace(/\s/g, '');
    const dup = users.find(u => String(u.name).replace(/\s/g, '') === key);
    if (dup) {
      showMessage('이미 등록된 이름입니다', `${dup.name} (${dup.id}) · 같은 사람이면 아래 목록에서 선택해 재등록하고, 동명이인이면 이름 뒤에 구분을 붙여 주세요 (예: 홍길동A).`, 'err', 8000);
      return;
    }
  }

  registering = true;
  const btn = document.getElementById('regBtn');
  const bar = document.getElementById('regProgress');
  btn.disabled = true;
  try {
    const samples = [];
    let tries = 0;
    while (samples.length < 3 && tries < 15) {
      tries++;
      showMessage('정면을 바라봐 주세요',
        `촬영 ${samples.length}/3 · 시도 ${tries}/15 · ${backendName()}` + (lastDetectMs ? ` · 1회 ${(lastDetectMs / 1000).toFixed(1)}초` : ''));
      const r = await detectOnce(60000, 416);
      drawBox(r);
      if (r) { samples.push(r.descriptor); bar.style.width = (samples.length / 3 * 100) + '%'; }
      else if (await maybeSwitchBackend()) { tries = 0; }
      await new Promise(res => setTimeout(res, 300));
    }
    if (samples.length < 3) {
      showMessage('얼굴을 찾지 못했습니다', '밝은 곳에서 얼굴을 화면 가운데에 맞추고 다시 시도하세요.', 'err', 6000);
    } else {
      const avg = Array.from({ length: 128 }, (_, i) => samples.reduce((s, d) => s + d[i], 0) / samples.length);
      const r = await apiPost({ action: 'register', id: existingId || '', name, consent: true, descriptor: avg });
      if (!r.ok) showMessage('등록 실패', r.message, 'err', 6000);
      else {
        showMessage(`${r.name}님 ${r.updated ? '재등록' : '등록'} 완료`, `이용자번호 ${r.id}`, 'ok', 5000);
        document.getElementById('regName').value = '';
        document.getElementById('regConsent').checked = false;
        regExisting.value = '';
        await loadUsers();
      }
    }
  } catch (e) {
    showMessage('등록 중 오류', '오류 내용: ' + (e && e.message ? e.message : e), 'err');
  } finally {
    setTimeout(() => drawBox(null), 1500);
    bar.style.width = '0';
    btn.disabled = false;
    registering = false;
    updateCount();
  }
}

/* ---------- 화면 전환 ---------- */
function applyMode(m) {
  mode = m;
  document.getElementById('tabAttend').classList.toggle('on', m === 'attend');
  document.getElementById('tabRegister').classList.toggle('on', m === 'register');
  document.getElementById('attendPanel').classList.toggle('hidden', m !== 'attend');
  document.getElementById('registerPanel').classList.toggle('hidden', m !== 'register');
  attendBtn.classList.toggle('hidden', m !== 'attend' || AUTO_MODE);
  cooldownUntil = 0;
  resumeCamera();
  idleMessage();
}
function setMode(m) {
  if (m === 'register' && mode !== 'register') {
    document.getElementById('pinInput').value = '';
    document.getElementById('pinErr').textContent = '';
    document.getElementById('pinWrap').classList.remove('hidden');
    setTimeout(() => document.getElementById('pinInput').focus(), 50);
    return;
  }
  applyMode(m);
}
function checkPin() {
  if (document.getElementById('pinInput').value === ADMIN_PIN) {
    document.getElementById('pinWrap').classList.add('hidden');
    applyMode('register');
  } else {
    document.getElementById('pinErr').textContent = '비밀번호가 맞지 않습니다.';
  }
}
document.getElementById('tabAttend').onclick = () => setMode('attend');
document.getElementById('tabRegister').onclick = () => setMode('register');
document.getElementById('pinOk').onclick = checkPin;
document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });
document.getElementById('pinCancel').onclick = () => { document.getElementById('pinWrap').classList.add('hidden'); resumeCamera(); };
document.getElementById('regBtn').onclick = registerFace;
attendBtn.onclick = attendByButton;
document.getElementById('manualBtn').onclick = () => {
  const id = manualSelect.value;
  if (!id) { showMessage('이름을 선택하세요', '', 'err', 3000); return; }
  attend(id, '수동');
  manualSelect.value = '';
};
document.getElementById('reloadBtn').onclick = async () => {
  try { await loadUsers(); showMessage('새로고침 완료', '이용자 목록을 다시 불러왔습니다.', 'ok', 2500); }
  catch (e) { showMessage('연결 오류', '웹앱 주소를 확인하세요.', 'err', 4000); }
};

/* ---------- 시작 ---------- */
async function init() {
  prepStart = performance.now();
  if (typeof faceapi === 'undefined') {
    showMessage('인식 기능 파일을 받지 못했습니다', '인터넷 연결을 확인하고 새로고침하세요.', 'err'); return;
  }

  // 1) 처리 방식 선택
  prepText = '처리 방식을 고르고 있습니다';
  showPrep();
  let picked = false;
  for (const b of BACKENDS) { if (await useBackend(b)) { picked = true; break; } }
  if (!picked) { showMessage('얼굴 인식을 실행할 수 없습니다', '이 기기에서 지원하는 처리 방식이 없습니다.', 'err'); return; }

  // 2) 모델 불러오기
  prepText = '얼굴 인식 기능을 불러오고 있습니다';
  showPrep();
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
  } catch (e) {
    showMessage('인식 기능을 불러오지 못했습니다', '오류 내용: ' + (e && e.message ? e.message : e), 'err'); return;
  }

  // 3) 카메라
  prepText = '카메라를 켜고 있습니다';
  showPrep();
  try {
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
    await video.play();
    await new Promise(res => { if (video.readyState >= 2) res(); else video.onloadeddata = () => res(); });
    drawPreview();
  } catch (e) {
    showMessage('카메라를 사용할 수 없습니다', '카메라 권한을 허용하세요. 오류 내용: ' + (e && e.message ? e.message : e), 'err'); return;
  }

  // 4) 첫 실행 준비 (가장 느린 단계, 안 되면 다음 처리 방식으로)
  while (true) {
    prepText = '얼굴 인식을 처음 실행하고 있습니다';
    showPrep();
    try { await detectOnce(45000, 320); break; }
    catch (e) {
      if (!(await nextBackend())) {
        showMessage('얼굴 인식을 실행할 수 없습니다', '오류 내용: ' + (e && e.message ? e.message : e), 'err'); return;
      }
    }
  }

  // 5) 이용자 목록
  prepText = '이용자 목록을 불러오고 있습니다';
  showPrep();
  try { await loadUsers(); }
  catch (e) { showMessage('시트에 연결하지 못했습니다', '웹앱 주소와 배포 권한을 확인하세요. 오류 내용: ' + (e && e.message ? e.message : e), 'err'); return; }

  ready = true;
  if (AUTO_MODE) attendBtn.classList.add('hidden');
  idleMessage();
  if (AUTO_MODE) loop();
}
init();
</script>
